<!DOCTYPE html>
<html lang="en">

<div class="app">

  <a data-v="dashboard" tabindex="0"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></a>

  <a data-v="doctors" tabindex="0"><svg viewBox="0 0 24 24"><path d="M6 3v6a4 4 0 0 0 8 0V3M10 13v3a4 4 0 0 0 8 0v-1"/><circle cx="18" cy="13" r="2"/></svg><span>Doctors</span></a>

 </nav>
 <div class="me" id="me"></div>

</aside>
<main id="view"></main>
